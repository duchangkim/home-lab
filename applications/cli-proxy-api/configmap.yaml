# config.yaml은 이 템플릿이 정본이다.
# initContainer가 기동할 때마다 __PLACEHOLDER__를 시크릿 값으로 치환해 emptyDir에 쓴다.
# CLIProxyAPI는 config.yaml을 다시 쓰므로(secret-key 해싱, 관리 UI 저장) 쓰기 가능한 경로가 필요하다.
# 관리 UI에서 바꾼 설정은 재시작하면 사라진다. 설정 변경은 이 파일로 한다.
# OAuth 토큰은 PVC(/data/auths)에 저장되므로 재시작해도 유지된다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cli-proxy-api-config
  namespace: default
data:
  config.yaml: |
    config-version: 8

    server:
      host: ""
      port: 8317
      # 포워딩 헤더를 신뢰하지 않는다. 관리 API의 localhost 판정이 실제 소켓 주소로만 이뤄지게 한다.
      trusted-proxies: []
      discovery:
        enabled: false

    management:
      # localhost(같은 파드의 Tailscale 사이드카, kubectl port-forward)에서만 관리 API를 허용한다.
      # 클러스터 내부 파드에서 오는 요청은 원격으로 판정돼 거부된다.
      allow-remote: false
      secret-key: "__MANAGEMENT_KEY__"
      disable-control-panel: false

    access:
      api-keys:
        - "__API_KEY_OPENWEBUI__"
        - "__API_KEY_PERSONAL__"

    routing:
      strategy: "round-robin"
      retry:
        request-retry: 3

    oauth:
      auth-dir: "/data/auths"

    observability:
      logs:
        debug: false
        logging-to-file: false
        request-log: false
      usage:
        usage-statistics-enabled: true

    plugins:
      enabled: false
  # Tailscale serve: tailnet의 8317 포트를 파드 안 127.0.0.1:8317로 TCP 전달한다.
  serve.json: |
    {
      "TCP": {
        "8317": { "TCPForward": "127.0.0.1:8317" }
      }
    }
