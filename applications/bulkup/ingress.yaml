apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bulkup
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - bulkup.duchi.click
      secretName: bulkup-tls
  rules:
    - host: bulkup.duchi.click
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bulkup
                port:
                  number: 8080
