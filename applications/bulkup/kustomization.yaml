apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml

# 앱 코드는 ConfigMap으로 넣는다 — 파일이 바뀌면 이름 해시가 바뀌어 파드가 자동 재시작된다.
# 운동·증상 데이터는 PVC에만 있고 이 저장소에는 앱 코드만 있다.
configMapGenerator:
  - name: bulkup-app
    files:
      - app/server.py
      - app/index.html
