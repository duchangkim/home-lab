apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openwebui-data
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openwebui
  template:
    metadata:
      labels:
        app: openwebui
    spec:
      containers:
        - name: openwebui
          image: ghcr.io/open-webui/open-webui:v0.7.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ENABLE_ADMIN_CHAT_ACCESS
              value: "false"
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: openwebui-secret
                  key: webui-secret-key
            # OpenAI 호환 연결: 1순위 CLIProxyAPI(클러스터 내부), 2순위 OpenRouter
            # 주의: PersistentConfig라서 이미 저장된 설정이 있으면 env보다 DB 값이 우선한다.
            - name: CLI_PROXY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openwebui-secret
                  key: cli-proxy-api-key
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openwebui-secret
                  key: openrouter-api-key
            - name: OPENAI_API_BASE_URLS
              value: "http://cli-proxy-api.default.svc.cluster.local:8317/v1;https://openrouter.ai/api/v1"
            - name: OPENAI_API_KEYS
              value: "$(CLI_PROXY_API_KEY);$(OPENROUTER_API_KEY)"
          volumeMounts:
            - name: data
              mountPath: /app/backend/data

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openwebui-data
---
apiVersion: v1
kind: Service
metadata:
  name: openwebui
  namespace: default
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: openwebui
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openwebui
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - ai.duchi.click
      secretName: openwebui-tls
  rules:
    - host: ai.duchi.click
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openwebui
                port:
                  number: 8080
