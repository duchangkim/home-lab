# SearXNG 설정. 기본값(searx/settings.yml) 위에 여기 적은 값만 덮어쓴다.
# OpenWebUI 웹검색 백엔드로만 쓰는 클러스터 내부 전용 인스턴스다.
use_default_settings: true

general:
  instance_name: "homelab-search"

server:
  # 실제 값은 SEARXNG_SECRET 환경변수(searxng-secret)가 덮어쓴다.
  secret_key: "overridden-by-SEARXNG_SECRET"
  # 내부 전용이라 봇 차단(limiter, valkey 필요)과 이미지 프록시를 끈다.
  limiter: false
  public_instance: false
  image_proxy: false

valkey:
  url: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  # OpenWebUI는 format=json으로 요청한다. json이 없으면 403이 난다.
  formats:
    - html
    - json

# 기본 활성 엔진(brave, google cse, wikipedia 등)에 일반 검색 엔진을 더한다.
# 엔진을 여러 개 쓰면 한 엔진이 CAPTCHA나 rate limit으로 막혀도 결과가 비지 않고, 엔진별 요청 부담도 나뉜다.
# duckduckgo는 이 서버 IP에서 매번 CAPTCHA를 반환해 응답만 늦추므로 끈다.
engines:
  - name: bing
    disabled: false
  - name: yahoo
    disabled: false
  - name: duckduckgo
    disabled: true

outgoing:
  request_timeout: 4.0
  max_request_timeout: 10.0
  pool_connections: 50
  pool_maxsize: 10

ui:
  static_use_hash: true
